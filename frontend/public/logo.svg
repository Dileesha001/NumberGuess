<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neon-glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="neon-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Gradient for Text/Accents -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cricket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)" />

  <!-- Outer Glowing Shield/Octagon Ring -->
  <polygon points="256,40 436,115 472,310 346,460 166,460 40,310 76,115" 
           fill="none" stroke="url(#shield-grad)" stroke-width="6" 
           style="filter: drop-shadow(0 0 15px rgba(79, 70, 229, 0.4)); opacity: 0.85;" />
  
  <!-- Glowing Hexagon Core -->
  <polygon points="256,80 396,140 422,290 326,410 186,410 90,290 116,140" 
           fill="#111827" fill-opacity="0.6" stroke="#312e81" stroke-width="2" />

  <!-- Game elements integrated into the design -->
  <g id="game-icons" style="opacity: 0.35;">
    <!-- 1. Number Guessing (Numbers floating in background) -->
    <text x="130" y="160" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#06b6d4" filter="url(#neon-glow-indigo)">7</text>
    <text x="350" y="180" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#06b6d4" filter="url(#neon-glow-indigo)">42</text>
    <text x="140" y="320" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#06b6d4" filter="url(#neon-glow-indigo)">99</text>

    <!-- 2. Hangman Noose/Figure (Stylized vector style on the right side) -->
    <path d="M 340,280 L 370,280 M 355,280 L 355,250 L 380,250 L 380,260" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <circle cx="380" cy="265" r="5" fill="none" stroke="#f43f5e" stroke-width="2" />

    <!-- 3. Mini Cricket Bat & Ball (Stylized on the left side) -->
    <line x1="120" y1="260" x2="150" y2="230" stroke="url(#cricket-grad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="155" cy="225" r="4" fill="#ef4444" />
  </g>

  <!-- Glowing Game Controller Backdrop -->
  <path d="M 180,180 
           C 150,180 130,200 130,230 
           L 130,300 
           C 130,340 160,360 200,360 
           C 220,360 235,350 256,340 
           C 277,350 292,360 312,360 
           C 352,360 382,340 382,300 
           L 382,230 
           C 382,200 362,180 332,180 
           Z" 
        fill="none" stroke="#6366f1" stroke-width="8" stroke-linejoin="round"
        filter="url(#neon-glow-indigo)" style="opacity: 0.95;" />

  <!-- D-Pad (Left side of controller) -->
  <path d="M 175,245 L 175,275 M 160,260 L 190,260" fill="none" stroke="#00f2ff" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow-indigo)" />

  <!-- Action Buttons (Right side of controller - Glowing Emerald and Rose) -->
  <circle cx="320" cy="260" r="7" fill="#10b981" filter="url(#neon-glow-emerald)" />
  <circle cx="340" cy="245" r="7" fill="#f43f5e" filter="url(#neon-glow-rose)" />
  <circle cx="340" cy="275" r="7" fill="#6366f1" filter="url(#neon-glow-indigo)" />
  
  <!-- Stylized Cricket Bat & Ball (Superimposed in the center, crossing behind text) -->
  <g transform="translate(256, 260) rotate(-45)">
    <!-- Cricket Bat -->
    <rect x="-8" y="-90" width="16" height="110" rx="4" fill="url(#cricket-grad)" stroke="#ffffff" stroke-width="2" style="filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));" />
    <!-- Grip wrap detail -->
    <rect x="-8" y="-90" width="16" height="30" fill="#111827" rx="2" />
    <line x1="-8" y1="-80" x2="8" y2="-80" stroke="#cbd5e1" stroke-width="1" />
    <line x1="-8" y1="-70" x2="8" y2="-70" stroke="#cbd5e1" stroke-width="1" />
    <!-- Crimson Ball orbiting -->
    <circle cx="28" cy="-40" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2" style="filter: drop-shadow(0 0 10px #ef4444);" />
    <path d="M 16,-40 A 12,12 0 0,0 40,-40" fill="none" stroke="#ffffff" stroke-dasharray="2 2" stroke-width="1.5" />
  </g>

  <!-- Stylized "DPR" Central Typography -->
  <g transform="translate(0, 0)">
    <!-- Drop Shadow for Text -->
    <text x="256" y="323" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#030712" text-anchor="middle" letter-spacing="4">DPR</text>
    <!-- Foreground Metallic Text -->
    <text x="256" y="320" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="url(#metal-grad)" text-anchor="middle" letter-spacing="4" style="filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));">DPR</text>
  </g>

  <!-- Subtitle: "MINI GAMES" -->
  <rect x="140" y="375" width="232" height="32" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
  <text x="256" y="396" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#a5b4fc" text-anchor="middle" letter-spacing="5">MINI GAMES</text>
</svg>
